[package]
name = "riffq"
version = "0.1.11"
edition = "2024"
# `rust-consumer/` is its own crate rather than a cargo example, for two
# reasons: an example inherits this crate's features, and with `python` on it
# would link against an interpreter a standalone binary does not have -- and
# `examples/` is gitignored here, so an example would not be in the repository
# at all.
exclude = ["rust-consumer"]

[lib]
name = "_riffq"
# cdylib for the Python extension module, rlib so a Rust consumer can link the
# crate. Both, because the wheel and a Rust binary are two builds of one
# library rather than two libraries.
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
# The Python surface: the `_riffq` extension module, the `Server` pyclass, and
# the worker that marshals callbacks into an interpreter. On by default, so
# `maturin build` and every existing consumer are unchanged.
#
# Off, the crate is the protocol core alone -- pgwire, the DataFusion catalog
# and the Arrow encoding -- with `QueryRunner` and `SessionHooks` left for the
# consumer to implement. That build links no interpreter, which is the whole
# point: pyo3's `extension-module` leaves Python's symbols undefined for the
# host process to provide, and a Rust binary is not one.
python = ["dep:pyo3"]

[profile.fast]
inherits = "dev"
opt-level = 1
debug = false
overflow-checks = false
incremental = true
codegen-units = 4

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }

pgwire = "0.40.0"
# pgwire = { git = "https://github.com/ybrs/pgwire", branch = "expose-sni", package = "pgwire" }

bytes = "1.5"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
hex = "0.4.3"
postgres-types = "0.2"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"
arrow = { version = "58.0.0", features = ["ffi", "canonical_extension_types"] }
sqlparser = "0.62"


chrono = "0.4.41"
log = "0.4"
datafusion = "54.0.0"
# Pinned to a pg_catalog main commit (DataFusion 54). Bump the rev to pull in
# newer pg_catalog changes.
datafusion_pg_catalog = { git = "https://github.com/ybrs/pg_catalog", rev = "984e4962e977058fba33516e69e89a347683afcf", package = "datafusion_pg_catalog" }

env_logger = "0.11.8"


arrow-schema  = { version = "58.0.0" }
